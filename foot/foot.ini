# foot configuration
# ~/.config/foot/foot.ini

[main]
# Shell - left unset on purpose: foot.ini does not expand $SHELL like a
# real shell would, so "shell=$SHELL" tries to literally execute a program
# named "$SHELL" and fails. Omitting this option makes foot use your
# login shell automatically. If you want to hardcode one, use a real path,
# e.g. shell=/bin/bash or shell=/usr/bin/zsh

# Font: JetBrains Mono Nerd Font matches the rest of the system
# Fallback to Noto Color Emoji for emoji, Noto Sans Mono CJK for Asian chars
font=JetBrains Mono Nerd Font:size=12, Noto Color Emoji:size=12, Noto Sans Mono CJK:size=12

# Font size adjustment when zooming (ctrl++, ctrl+-)
font-size-adjustment=0.75

# Slightly more padding for breathing room
pad=8x8 center

# Gamma-correct blending for crisper text rendering
gamma-correct-blending=yes

# DPI-aware scaling (consistent physical size across monitors)
dpi-aware=no

# Use nice box-drawing characters instead of font glyphs
box-drawings-uses-font-glyphs=no

# Bold text rendered in bright colors
bold-text-in-bright=yes

# Word delimiters for double-click selection
word-delimiters=,│`|:"'()[]{}<>

# Copy to clipboard on selection (more convenient than primary selection)
selection-target=both

# Initial window size
initial-window-size-chars=100x35

# Title
title=foot — soft lavender

[colors]
# Soft Lavender Theme - matches SwayFX + Waybar + Wofi
background=122a1e
foreground=c3c9c6

# Regular colors
regular0=122a1e
regular1=508777
regular2=508777
regular3=C5A856
regular4=477787
regular5=477787
regular6=61998F
regular7=c3c9c6

# Bright colors
bright0=61766c
bright1=55834E
bright2=98fb98     # bright green
bright3=ffec8b     # bright yellow
bright4=b0e0e6     # bright blue
bright5=55834E
bright6=89dceb     # bright cyan
bright7=ffffff     # bright white

# Selection colors
selection-foreground=1a1a1a
selection-background=477787

# URL underline color
urls=477787

# Subtle transparency (0.9 = 90% opaque)
# Set to 1.0 for fully opaque, or lower for more transparency
alpha=0.95

[scrollback]
# More scrollback history
lines=5000

# Scroll speed multiplier
multiplier=3.0

# Show scrollback position indicator
indicator-position=relative

[url]
# URL launcher (uses xdg-open by default)
# launcher=xdg-open

# URL mode keybinding (Shift+Alt+U to enter URL mode)
# See key-bindings section below

[key-bindings]
# Copy/paste
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste

# Scrollback search
search-start=Control+Shift+r

# Font zoom
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract

# Scrollback navigation
scrollback-up-page=Shift+Page_Up Shift+KP_Page_Up
scrollback-down-page=Shift+Page_Down Shift+KP_Page_Down

# New terminal
spawn-terminal=Control+Shift+n

# URL mode (highlight clickable URLs)
show-urls-launch=Shift+Alt+u
